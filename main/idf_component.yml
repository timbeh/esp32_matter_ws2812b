dependencies:
  # Keep the Component Manager resolver on the tested ESP-IDF release.
  idf: "5.5.3"
  # Keep the LED driver API stable across fresh component-manager resolutions.
  espressif/led_strip: "1.0.0"
  espressif/cmake_utilities:
    version: "1.1.1"
    rules: # will add "optional_component" only when all if clauses are True
    - if: idf_version >=5.0
    - if: target in [esp32c2]
